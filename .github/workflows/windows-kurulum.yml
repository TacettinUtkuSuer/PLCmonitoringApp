name: Windows kurulum (kur.exe)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main, "claude/**"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/test_backend.py
      - run: python tests/test_source.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Surum
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "ver=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT; else echo "ver=0.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT; fi
      - name: derle.bat
        shell: cmd
        run: derle.bat ${{ steps.v.outputs.ver }}
      - name: Duman testi (exe 8989'da cevap veriyor mu?)
        shell: pwsh
        run: |
          $env:BENCHMONITOR_DATA = "$env:RUNNER_TEMP\bmdata"
          $p = Start-Process dist\BenchMonitor\BenchMonitor.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $r = Invoke-WebRequest http://localhost:8989/ -UseBasicParsing -TimeoutSec 2; $ok = ($r.StatusCode -eq 200) } catch {}
          }
          Stop-Process $p -Force
          Get-Content "$env:BENCHMONITOR_DATA\logs\benchmonitor.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "exe 8989'da cevap vermedi" }
      - uses: actions/upload-artifact@v4
        with:
          name: kur-${{ steps.v.outputs.ver }}
          path: Output/kur.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/kur.exe
